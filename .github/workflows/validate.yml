name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      sign-updates:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis msi
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run check:versions
      - name: Require the updater signing key for release builds
        if: inputs.sign-updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before a signed release."
            exit 1
          fi
      - name: Match release tag to application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: npm run check:versions -- "$RELEASE_TAG"
      - run: npm test
      - name: Recognize synthetic screenshot with bundled English model
        run: npm run test:ocr
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      # Tauri runs npm run build (including TypeScript) before the native build.
      - name: Build unsigned validation installers
        if: ${{ !inputs.sign-updates }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.unsigned.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Build signed updater artifacts and installers
        if: inputs.sign-updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Prepare signed release assets
        if: inputs.sign-updates
        run: node scripts/update-manifest.mjs prepare ${{ matrix.target }}
      - name: Verify artifact signatures with the native updater
        if: inputs.sign-updates
        env:
          UPDATER_SMOKE_DIRECTORY: ${{ github.workspace }}/release-artifacts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --test updater_download signed_release_artifacts_match_the_committed_public_key -- --ignored
      - name: Archive macOS application preserving permissions
        if: runner.os == 'macOS' && !inputs.sign-updates
        run: tar -czf "src-tauri/target/${{ matrix.target }}/release/bundle/dev-toolbox_${{ matrix.target }}.app.tar.gz" -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" dev-toolbox.app
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.sign-updates }}
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        if: inputs.sign-updates
        with:
          name: installers-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
