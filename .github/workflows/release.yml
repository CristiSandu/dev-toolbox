name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      sign-updates: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true
      - name: Assemble complete stable update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/update-manifest.mjs merge artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dev Toolbox ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*.app.tar.gz
            artifacts/*.sig
            artifacts/*.exe
            artifacts/*.msi
            artifacts/latest.json
          body: |
            Native builds, regression checks, and updater signature verification passed for all configured targets.
            Complete docs/RELEASING.md, including installation and data-retention checks,
            before publishing this draft. This release includes signed updater artifacts and latest.json.
            Review platform signing/notarization and OS trust prompts before broad distribution.
